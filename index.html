<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Data Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <form>
      <div class="txt">
      <label for="name">Nama:</label>
      <input type="text">
      <label for="password">Password:</label>
      <input type="password">
      </div>
      Jenis Kelamin:
      <div class="rad">
        <label for="L">Laki-Laki</label>
      <input type="radio" name="log" value="L"><label for="L">
        <label for="P">Perempuan</label>
      <input type="radio" name="log" value="P"><label for="P">
        <label for="F">Femboy</label>
      <input type="radio" name="log" value="F">
      </div>
      Hobi:
      <div class="cb">
        <label for="Mgame">Main game</label>
      <input type="checkbox" name="hobi" value="MGame">
      <label for="Mbg">Makan Mbg</label>
      <input type="checkbox" name="hobi" value="Mbg">
      <label for="Turu">Turu</label>
      <input type="checkbox" name="hobi" value="Turu">
      </div>
      Asal Kota:
      <select name="Kota">
        <option value="CRB">Cirebon</option>
        <option value="JKT">Jakarta</option>
        <option value="BDG">Bandung</option>
        <option value="SBY">Surabaya</option>
        <option value="SMG">Semarang</option>
        <option value="YGY">Yogyakarta</option>
        <option value="MDN">Medan</option>
        <option value="PLB">Palembang</option>
        <option value="MKS">Makassar</option>
        <option value="BPN">Balikpapan</option>
        <option value="BJM">Banjarmasin</option>
        <option value="DPS">Denpasar</option>
        <option value="PKB">Pekanbaru</option>
        <option value="BKL">Bengkulu</option>
        <option value="JMB">Jambi</option>
        <option value="PDG">Padang</option>
        <option value="BTM">Batam</option>
        <option value="PWT">Purwokerto</option>
        <option value="TGR">Tangerang</option>
        <option value="BKS">Bekasi</option>
        <option value="DPK">Depok</option>
        <option value="SRG">Serang</option>
        <option value="MTR">Mataram</option>
        <option value="KDI">Kendari</option>
        <option value="PLK">Palangkaraya</option>
        <option value="PNT">Pontianak</option>
        <option value="SMD">Samarinda</option>
        <option value="Manado">Manado</option>
        <option value="JYP">Jayapura</option>
        <option value="AMB">Ambon</option>
      </select>
      <label for="komentar">Komentar Anda:</label>
      <textarea id="komentar" placeholder="Masukkan Komentar Anda Di Sini..."></textarea>
     <button type="submit">Kirim</button>
    </form>
  </div>
</body>
      </html>
